name: Daily CCASS Update

on:
  schedule:
    - cron: "0 1 * * 1-5"    # 工作日 UTC 01:00 = 北京时间 09:00
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write             # 允许机器人提交数据

# 同一时间只允许一个实例：防止上一次运行尚未 push 时下一次又 checkout 旧代码，
# 导致 rebase 冲突或数据互相覆盖。排队而非取消（cancel 会丢一次数据抓取）。
concurrency:
  group: daily-ccass-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45       # 29 只股票 × 月级缓存命中时约几分钟，兜底防挂死
    env:
      # 关键：港交所数据发布与「最新可查日」按香港时间判断。
      # GitHub Actions 服务器默认 UTC，不设 TZ 会导致 datetime.now() 取到 UTC 时间，
      # 凌晨/上午运行时误判「数据未发布」，把参考日错退一天。
      TZ: Asia/Hong_Kong
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'        # 缓存 requests/bs4/lxml，省约 20s 安装时间

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show current time (timezone sanity check)
        run: |
          echo "服务器当前时间: $(date)"
          echo "若上面显示的不是香港时间(HKT)，说明 TZ 未生效，日期判断会出错。"

      - name: Run incremental update
        run: python update.py -c 00020 00100 00148 00300 00700 01288 01347 01548 01810 01815 01888 02359 02388 02513 02723 02865 03308 03986 06181 06809 06869 06915 06990 09606 09660 09880 09903 09988 03317 -m 12

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/holdings.json data/raw_cache
          # 若无变化（如非交易日/数据未发布）则不提交，也跳过后续构建与部署
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据无变化，跳过提交与部署。"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore: update ccass data $(date +%Y-%m-%d)"
          # 先同步远程最新（rebase），避免因仓库被其他方式更新过而 push 被拒；
          # holdings.json 若冲突，优先用本次 CI 抓到的最新数据（-X ours）。
          if ! git pull --rebase --no-edit -X ours origin main; then
            echo "::warning::rebase 失败，放弃本次提交以免覆盖远程。"
            git rebase --abort
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push

      # ============ 构建 React 版前端并部署到 Vercel ============
      # 仅在数据有变化时执行：数据没变时产物与线上完全相同，没必要每天空跑一次部署。
      # Vercel 替代 CloudBase：runner → Vercel 全球 CDN（日本/新加坡节点），网络稳定，
      # 不会出现"User network is too slow"问题。自定义域名在 Vercel 后台绑定即可。
      - name: Setup Node
        if: steps.commit.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: ccass-tracker-web/package.json

      - name: Sync latest holdings.json into React projects
        if: steps.commit.outputs.changed == 'true'
        run: |
          # public/data/holdings.json 已从 git 移除（避免仓库存过期副本），
          # 统一在构建前从 data/holdings.json 复制；web 与 mobile 保持同一份数据。
          mkdir -p ccass-tracker-web/public/data ccass-tracker-mobile/public/data
          cp data/holdings.json ccass-tracker-web/public/data/holdings.json
          cp data/holdings.json ccass-tracker-mobile/public/data/holdings.json

      - name: Build React frontend
        if: steps.commit.outputs.changed == 'true'
        working-directory: ccass-tracker-web
        run: |
          npm ci
          npm run build

      - name: Deploy to Vercel
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" --yes \
            || { echo "::error::Vercel 部署失败"; exit 1; }
          echo "Vercel 部署完成"
