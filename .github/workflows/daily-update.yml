name: Daily CCASS Update

on:
  schedule:
    - cron: "0 1 * * *"       # 每天 UTC 01:00 = 北京时间 09:00（周末无新数据时自动跳过，不产生空提交）
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write             # 允许机器人提交数据

# 同一时间只允许一个实例：防止上一次运行尚未 push 时下一次又 checkout 旧代码，
# 导致 rebase 冲突或数据互相覆盖。排队而非取消（cancel 会丢一次数据抓取）。
concurrency:
  group: daily-ccass-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45       # 29 只股票 × 月级缓存命中时约几分钟，兜底防挂死
    env:
      # 关键：港交所数据发布与「最新可查日」按香港时间判断。
      # GitHub Actions 服务器默认 UTC，不设 TZ 会导致 datetime.now() 取到 UTC 时间，
      # 凌晨/上午运行时误判「数据未发布」，把参考日错退一天。
      TZ: Asia/Hong_Kong
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'        # 缓存 requests/bs4/lxml，省约 20s 安装时间

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show current time (timezone sanity check)
        run: |
          echo "服务器当前时间: $(date)"
          echo "若上面显示的不是香港时间(HKT)，说明 TZ 未生效，日期判断会出错。"

      - name: Run incremental update
        run: python update.py -c 00020 00100 00148 00300 00700 01288 01347 01548 01810 01815 01888 02359 02388 02513 02723 02865 03308 03986 06181 06809 06869 06915 06990 09606 09660 09880 09903 09988 03317 02099 02259 06693 01548 03759 -m 12

      # ============ 提交数据即完成部署 ============
      # 前端部署由 Vercel 的 Git 集成负责：push 到 main 后 Vercel 自动按
      # ccass-tracker-web/vercel.json 构建（复制数据 → vite build）并发布生产。
      # 项目在 Vercel 后台的设置：Root Directory = ccass-tracker-web。
      # CI 无需 Node / Vercel CLI / 任何部署密钥。
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/holdings.json data/raw_cache
          # 若无变化（如非交易日/数据未发布）则不提交，也不会触发重新部署
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交。"
            exit 0
          fi
          git commit -m "chore: update ccass data $(date +%Y-%m-%d)"
          # 先同步远程最新（rebase），避免因仓库被其他方式更新过而 push 被拒；
          # holdings.json 若冲突，优先用本次 CI 抓到的最新数据（-X ours）。
          if ! git pull --rebase --no-edit -X ours origin main; then
            echo "::warning::rebase 失败，放弃本次提交以免覆盖远程。"
            git rebase --abort
            exit 0
          fi
          git push
